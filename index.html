<html lang="en" data-view="home">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Billboard Charts</title>

<style>
/* Each page has its own background: home = dark, Billboard 200 = white, iTunes = light gray, Hot 100 = charcoal */
:root{--bg:#ffffff;--panel:#ffffff;--text:#1d1d1f;--muted:#6e6e73;--line:#e4e4ea;--hover:#f6f6fa;--accent:#fc3c44;--up:#16994a;--down:#e0313b;--eq:#8e8e93;--new:#0a72e8;--pk:#d99a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
:root[data-view="itunes"]{--bg:#e3e3e8;--panel:#f8f8fa;--line:#d3d3db;--hover:#eeeef3}
:root[data-view="home"]{--bg:#0e0e11;--panel:#1b1b20;--text:#f2f2f4;--muted:#9c9ca4;--line:#2a2a31;--hover:#25252a;--up:#35c45f;--down:#ff5c63;--new:#4ea3ff;--pk:#f0b429;color-scheme:dark}
:root[data-view="hot100"]{--bg:#2a2733;--panel:#363242;--text:#f4f3f7;--muted:#aaa5b8;--line:#4a4558;--hover:#403b4e;--up:#35c45f;--down:#ff5c63;--new:#4ea3ff;--pk:#f0b429;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 Figtree,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.top{background:linear-gradient(110deg,#c9457f 0%,#8d4fc2 55%,#5b4bc9 100%);color:#fff;padding:14px 16px}
.hd{display:flex;align-items:center;gap:14px;color:inherit;text-decoration:none}
.logo{width:42px;height:42px;border-radius:11px;background:#000;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.wrap{max-width:1000px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.5px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
select,input{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);min-width:0}
input{width:210px}
:focus-visible{outline:2px solid var(--new);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:16px 0;overflow:hidden}
.stat{padding:12px 14px;border-right:1px solid var(--line);min-width:0}
.stat:last-child{border:0}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.demo{display:none;margin:0 0 12px;padding:9px 12px;border-radius:8px;background:rgba(217,154,0,.14);color:var(--text);font-size:13px;border:1px solid var(--pk)}
.scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:680px}
th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
th.n,td.n{text-align:right}
th[aria-sort]{color:var(--text)}
th[aria-sort="ascending"]::after{content:" ▴"}
th[aria-sort="descending"]::after{content:" ▾"}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.r{cursor:pointer}
tr.r:hover{background:var(--hover)}
.pos{display:flex;align-items:center;gap:8px;white-space:nowrap}
.pos b{font-size:20px;font-weight:800;min-width:28px}
.v{font-size:12.5px;font-weight:700;padding:2px 7px;border-radius:99px;white-space:nowrap}
.up{color:var(--up);background:color-mix(in srgb,var(--up) 14%,transparent)}
.down{color:var(--down);background:color-mix(in srgb,var(--down) 14%,transparent)}
.eq{color:var(--eq);background:color-mix(in srgb,var(--eq) 16%,transparent)}
.new,.re{color:var(--new);background:color-mix(in srgb,var(--new) 14%,transparent)}
.t{font-weight:600}
.a{color:var(--muted);font-size:13.5px}
.num{font-variant-numeric:tabular-nums}
.star{color:var(--pk);font-weight:800}
.d td{background:var(--hover);padding:14px 16px}
.dg{display:grid;grid-template-columns:2fr 1fr 1fr;gap:16px;font-size:13.5px}
.lb{color:var(--muted);font-size:12.5px}
.note{color:var(--muted);font-size:12.5px;margin:12px 2px 24px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.crumb{display:flex;align-items:baseline;gap:8px;margin:0 0 14px;color:var(--muted);font-size:14px}
.crumb a{color:var(--muted);font-weight:600;text-decoration:none}
.crumb a:hover{color:var(--text);text-decoration:underline}
.crumb b{color:var(--text);font-size:20px;font-weight:800;letter-spacing:-.3px}
.al{display:flex;align-items:center;gap:12px}
.cv{width:48px;height:48px;border-radius:6px;object-fit:cover;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tile{display:block;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none}
.tile:hover{border-color:var(--muted)}
.band{padding:26px 18px 22px;color:#fff}
.tn{font-size:24px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
.ts{font-size:13.5px;opacity:.92;margin-top:4px}
.tb{padding:14px 18px 16px}
.tb small{display:block;color:var(--muted);font-size:12px}
.t1{margin:3px 0 10px}
.t1 b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t1 span{color:var(--muted);font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.stats{grid-template-columns:1fr}.stat{border-right:0;border-bottom:1px solid var(--line)}.stat:last-child{border-bottom:0}.dg{grid-template-columns:1fr}input{width:100%}.tools{width:100%}select{flex:1}.tiles{grid-template-columns:1fr}}
</style>
</head>

 itunes:{name:'iTunes',sub:'Digital sales',c1:'#5b4bc9',c2:'#4332a6',noun:'a song',vl:'Sales',unit:'sales',third:'total',items:S,weeks:WEEKS,mult:K,
  cols:[['pos','POS'],['title','Song'],['sales','Sales',1],['total','Total',1],['pk','PEAK',1],['wks','Wks',1],['lw','LW',1]]}
};
function compute(c){const hist={};let prev={};
 Object.entries(c.pre||{}).forEach(([id,path])=>{const k=path.filter(Boolean);hist[id]={pk:k.length?Math.min(...k):999,tot:0,wks:path.length,path:path.slice(),ls:0,deb:{pos:path[0],sales:0}};if(path[path.length-1])prev[id]=path[path.length-1]});
 const pre0=Object.keys(prev).length>0;
 c.weeks.forEach((w,i)=>{const cur={};
  w.out=w.rows.map((r,j)=>{const id=r[0],pos=r[3]||j+1,h=hist[id],sales=r[1]!=null?r[1]*c.mult:0,total=r[2]!=null?r[2]*c.mult:(h?h.tot:0)+sales,lw=prev[id]||null;
   let st='',v=null;const ps=(h&&lw)?h.ls:null;
   if(i>0||pre0){if(lw){v=lw-pos;st=v>0?'up':v<0?'down':'eq'}else st=h?'re':'new'}
   const pk=h?Math.min(h.pk,pos):pos,path=(h?h.path:[]).concat(pos),deb=h?h.deb:{pos,sales};
   hist[id]={pk,tot:total,wks:(h?h.wks:0)+1,path,ls:sales,deb};cur[id]=pos;
   const it=c.items[id];
   return{id,pos,hid:!!r[4],title:it[0],artist:it[1],cover:it[2]||null,sales,total,lw,v,st,ps,pk,np:!!h&&pos<h.pk,wks:hist[id].wks,path,deb}});
  w.out=w.out.filter(r=>!r.hid);
  prev=cur})}
Object.values(CH).forEach(compute);

const $=s=>document.querySelector(s),esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'),fmt=n=>n.toLocaleString('en-US');
let cur='itunes';const ST={};
const dw=c=>{const a=c.weeks.map(w=>!w.demo).lastIndexOf(true);return a<0?c.weeks.length-1:a};
const stt=k=>ST[k]||(ST[k]={wi:dw(CH[k]),key:'pos',dir:1,open:new Set()});
function chip(r){if(r.st==='new')return'<span class="v new">NEW</span>';if(r.st==='re')return'<span class="v re">RE</span>';if(!r.st)return'<span class="v eq">–</span>';
 if(r.st==='eq')return'<span class="v eq">=</span>';return`<span class="v ${r.st}">${r.st==='up'?'▲':'▼'}${Math.abs(r.v)}</span>`}
function cv(r){if(r.cover)return`<img class="cv" src="${esc(r.cover)}" alt="Cover of ${esc(r.title)}">`;
 const h=(r.id*47)%360;return`<div class="cv" aria-hidden="true" style="background:linear-gradient(145deg,hsl(${h} 55% 46%),hsl(${(h+40)%360} 55% 30%))">${esc(r.title[0].toUpperCase())}</div>`}
function td(k,r,c){
 if(k==='pos')return`<td><div class="pos"><b>#${r.pos}</b>${chip(r)}</div></td>`;
 if(k==='title'){const t=`<div class="t">${esc(r.title)}</div><div class="a">${esc(r.artist)}</div>`;return c.cover?`<td><div class="al">${cv(r)}<div>${t}</div></div></td>`:`<td>${t}</td>`}
 if(k==='sales')return`<td class="n num">${fmt(r.sales)}</td>`;
 if(k==='total')return`<td class="n num">${fmt(r.total)}</td>`;
 if(k==='pk')return`<td class="n num">${r.pk}${r.np?' <span class="star" title="New peak">★</span>':''}</td>`;
 if(k==='wks')return`<td class="n num">${r.wks}</td>`;
 return`<td class="n num">${r.lw||(r.st==='new'?'NEW':'–')}</td>`}
function fillWeeks(){const c=CH[cur];$('#wk').innerHTML=c.weeks.map((w,i)=>`<option value="${i}">${w.date}</option>`).join('');$('#wk').value=stt(cur).wi}
$('#wk').onchange=e=>{const s=stt(cur);s.wi=+e.target.value;s.open.clear();draw()};
$('#q').oninput=draw;
function detail(r,c,sc){
 const pw=r.path.filter(p=>p===r.pk).length;
 const run=`<div><span class="lb">Chart run</span><br><b>${r.path.map(p=>p?'#'+p:'?').join(' → ')}</b><br>${r.deb.pos?`<span class="a">Debut #${r.deb.pos}${c.novals?'':' · '+fmt(r.deb.sales)+' '+c.unit}</span><br>`:''}<span class="a">Peak #${r.pk} · ${pw} ${pw>1?'weeks':'week'}</span></div>`;
 const rest=c.novals
  ?`<div><span class="lb">Weeks on chart</span><br><b class="num">${r.wks}</b></div><div><span class="lb">Last week</span><br><b class="num">${r.lw?'#'+r.lw:'–'}</b></div>`
  :`<div><span class="lb">${c.vl} vs. last week</span><br>${sc==null?'<b>–</b> <span class="a">first week on chart</span>':`<b class="num" style="color:var(--${sc>0?'up':sc<0?'down':'eq'})">${sc>0?'▲ +':sc<0?'▼ ':'= '}${sc}%</b> <span class="a">(${fmt(r.ps)})</span>`}</div><div><span class="lb">Total sold</span><br><b class="num">${fmt(r.total)}</b></div>`;
 return`<tr class="d"><td colspan="${c.cols.length}"><div class="dg">${run}${rest}</div></td></tr>`}
function draw(){
 const c=CH[cur],s=stt(cur),w=c.weeks[s.wi],q=$('#q').value.trim().toLowerCase();
 $('#ct').innerHTML=`<a href="#/">All charts</a><span aria-hidden="true">/</span><b>${c.name}</b>`;
 $('#demo').style.display=w.demo?'block':'none';
 $('#hd').innerHTML=c.cols.map(col=>`<th class="${col[2]?'n':''}" tabindex="0" data-k="${col[0]}" ${s.key===col[0]?`aria-sort="${s.dir>0?'ascending':'descending'}"`:''}>${col[1]}</th>`).join('');
 document.querySelectorAll('th').forEach(th=>{const go=()=>{const k=th.dataset.k;if(s.key===k)s.dir=-s.dir;else{s.key=k;s.dir=(k==='sales'||k==='total'||k==='wks')?-1:1}draw()};th.onclick=go;th.onkeydown=e=>{if(e.key==='Enter')go()}});
 const o=w.out,top=o[0],nw=o.filter(r=>r.st==='new').length,cl=o.filter(r=>r.st==='up').sort((a,b)=>b.v-a.v)[0];
 $('#stats').innerHTML=`<div class="stat"><small>Number 1</small><b>${esc(top.title)}</b><span>${esc(top.artist)}</span></div><div class="stat"><small>Debuts</small><b>${s.wi?nw:'–'}</b><span>${s.wi?'new entries':'first week on record'}</span></div><div class="stat"><small>Biggest climb</small><b>${cl?esc(cl.title):'–'}</b><span>${cl?'▲'+cl.v+(cl.v>1?' positions':' position'):'no climbs'}</span></div>`;
 const val=r=>s.key==='lw'?(r.lw||999):s.key==='title'?r.title.toLowerCase():r[s.key];
 const rows=o.filter(r=>!q||(r.title+' '+r.artist).toLowerCase().includes(q)).sort((a,b)=>{const x=val(a),y=val(b);return(x>y?1:x<y?-1:a.pos-b.pos)*s.dir});
 $('#tb').innerHTML=rows.length?rows.map(r=>{const isO=s.open.has(r.id),sc=r.ps?Math.round((r.sales/r.ps-1)*100):null;
  return`<tr class="r" data-id="${r.id}" tabindex="0" aria-expanded="${isO}">${c.cols.map(col=>td(col[0],r,c)).join('')}</tr>`+
  (isO?detail(r,c,sc):'')}).join(''):`<tr><td colspan="${c.cols.length}" class="empty">No results. Try another name.</td></tr>`;
 document.querySelectorAll('tr.r').forEach(tr=>{const t=()=>{const id=+tr.dataset.id;s.open.has(id)?s.open.delete(id):s.open.add(id);draw()};tr.onclick=t;tr.onkeydown=e=>{if(e.key==='Enter')t()}});
 $('#note').innerHTML=`<span class="v up">▲</span> up · <span class="v down">▼</span> down · <span class="v eq">=</span> unchanged · <span class="v new">NEW</span> debut · <span class="v re">RE</span> re-entry · <span class="star">★</span> new peak. Peak and weeks count from the first week on record (${c.weeks[0].date}). Click ${c.noun} for details.`;
}
function renderHome(){
 $('#tiles').innerHTML=['itunes','hot100','bb200'].map(k=>{const c=CH[k],w=c.weeks[dw(c)],t=w.out[0];
  return`<a class="tile" href="#/${k}"><div class="band" style="background:linear-gradient(135deg,${c.c1},${c.c2})"><div class="tn">${c.name}</div><div class="ts">${c.sub}</div></div><div class="tb"><small>Number 1</small><div class="t1"><b>${esc(t.title)}</b><span>${esc(t.artist)}</span></div><small>Week of ${w.date}${w.demo?' · example data':''}</small></div></a>`}).join('')}
function route(){
 const k=(location.hash||'#/').replace(/^#\/?/,'');const ok=!!CH[k];
 document.documentElement.dataset.view=ok?k:'home';
 $('#home').hidden=ok;$('#chart').hidden=!ok;$('#tools').hidden=!ok;
 if(ok){cur=k;$('#q').value='';fillWeeks();draw();document.title=CH[k].name+' · Billboard Charts'}
 else{renderHome();document.title='Billboard Charts'}
 window.scrollTo(0,0)}
addEventListener('hashchange',route);
route();
</script>
</body>
</html>
